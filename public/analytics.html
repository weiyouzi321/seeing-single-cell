<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analytics · Seeing Single-Cell</title>
<script src="https://unpkg.com/three"></script>
<script src="https://unpkg.com/globe.gl"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#0a0a1a;color:#e8e8f0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100vh}
#header{position:relative;z-index:2;display:flex;align-items:center;gap:24px;padding:16px 32px;background:linear-gradient(180deg,rgba(10,10,26,0.95),rgba(10,10,26,0.7));border-bottom:1px solid rgba(124,58,237,0.2)}
#header .brand{font-size:20px;font-weight:700;background:linear-gradient(135deg,#4361ee,#7c3aed);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
#header .nav{margin-left:auto;display:flex;gap:16px;font-size:14px}
#header .nav a{color:#9ca3af;text-decoration:none;transition:color .2s}
#header .nav a:hover{color:#c4b5fd}
#stats{position:absolute;top:72px;right:32px;display:flex;flex-direction:column;gap:10px;z-index:3}
.stat-card{background:rgba(30,30,60,0.85);border:1px solid rgba(124,58,237,0.25);border-radius:12px;padding:12px 18px;min-width:180px;backdrop-filter:blur(8px)}
.stat-card .label{font-size:11px;color:#9ca3af;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.stat-card .value{font-size:24px;font-weight:700;background:linear-gradient(135deg,#4361ee,#7c3aed);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
#summary{position:absolute;bottom:24px;left:32px;display:flex;gap:16px;z-index:3}
#top-countries{background:rgba(30,30,60,0.85);border:1px solid rgba(124,58,237,0.25);border-radius:12px;padding:14px 18px;width:260px;backdrop-filter:blur(8px)}
#top-countries h3{font-size:11px;color:#9ca3af;text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px}
.country-row{display:flex;align-items:center;gap:10px;margin-bottom:6px;font-size:13px}
.country-row .flag{font-size:14px}
.country-row .name{flex:1;color:#cdd6f4}
.country-row .count{color:#a5b4fc;font-weight:600;font-variant-numeric:tabular-nums}
.bar{height:3px;border-radius:2px;background:linear-gradient(90deg,#4361ee,#7c3aed);margin-left:4px;min-width:2px}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0a0a1a;z-index:10}
.spinner{width:40px;height:40px;border:3px solid rgba(124,58,237,0.2);border-top-color:#7c3aed;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#load-fail{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#0a0a1a;z-index:10;text-align:center;padding:40px}
#load-fail .msg{color:#9ca3af;font-size:14px;line-height:1.6}
#load-fail .msg strong{color:#e8e8f0}
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <span class="brand">🔬 Seeing Single-Cell</span>
    <div class="nav">
      <a href="/#/analytics">Analytics</a>
      <a href="/">Dashboard</a>
    </div>
  </div>
  <div id="stats">
    <div class="stat-card"><div class="label">Total Visits</div><div class="value" id="visits">—</div></div>
    <div class="stat-card"><div class="label">Total Clicks</div><div class="value" id="clicks">—</div></div>
    <div class="stat-card"><div class="label">Countries</div><div class="value" id="countries">—</div></div>
  </div>
  <div id="summary">
    <div id="top-countries">
      <h3>Top Visitors</h3>
      <div id="country-list"></div>
    </div>
  </div>
  <div id="globeViz"></div>
</div>
<div id="loading"><div class="spinner"></div></div>
<div id="load-fail"><div class="msg"><strong>No analytics data yet.</strong><br>Visitors are being tracked.<br><span style="color:#666;font-size:12px">Data refreshes automatically.</span></div></div>

<script>
const STATS_JSON_URL = 'https://api.jsonbin.io/v3/b/__ANALYTICS_BIN_ID__/record?t=' + Date.now();

function parseUA(ua){
  if(/Mobile|Android|iPhone|iPad/.test(ua)) return 'mobile';
  if(/Macintosh|Mac OS/.test(ua)) return 'mac';
  if(/Windows/.test(ua)) return 'windows';
  if(/Linux/.test(ua)) return 'linux';
  return 'other';
}

function countryCodeToISO3(code){
  const map = {
    'CN':'CHN','US':'USA','GB':'GBR','DE':'DEU','FR':'FRA','JP':'JPN',
    'KR':'KOR','RU':'RUS','BR':'BRA','IN':'IND','CA':'CAN','AU':'AUS',
    'IT':'ITA','ES':'ESP','NL':'NLD','SE':'SWE','NO':'NOR','DK':'DNK',
    'FI':'FIN','PL':'POL','BE':'BEL','CH':'CHE','AT':'AUT','PT':'PRT',
    'SG':'SGP','HK':'HKG','TW':'TWN','MY':'MYS','TH':'THA','ID':'IDN',
    'VN':'VNM','PH':'PHL','MX':'MEX','AR':'ARG','CL':'CHL','ZA':'ZAF',
    'AE':'ARE','SA':'SAU','TR':'TUR','IL':'ISR','NZ':'NZL','IE':'IRL'
  };
  return map[code] || null;
}

function initGlobe(points){
  const globe = Globe()
    .globeImageUrl('//unpkg.com/three-globe/example/img/earth-night.jpg')
    .bumpImageUrl('//unpkg.com/three-globe/example/img/earth-topology.png')
    .pointsData(points)
    .pointAltitude(0.04)
    .pointColor(p => {
      const count = p.count || 1;
      if(count > 10) return '#7c3aed';
      if(count > 5) return '#a78bfa';
      return '#c4b5fd';
    })
    .pointRadius(0.6)
    .arcData(
      points.filter(a=>a.count>=2).slice(0,20).map(a => ({
        startLat: a.lat,
        startLng: a.lon,
        endLat: a.lat,
        endLng: a.lon,
        count: a.count,
      })).concat(
        points.slice(0,30).map((a,i) => ({
          startLat: 25,
          startLng: -70,
          endLat: a.lat,
          endLng: a.lon,
          count: a.count,
        }))
      )
    )
    .arcColor((a) => {
      const c = a.count || 1;
      return c > 5 ? '#7c3aed' : c > 2 ? '#a78bfa' : '#c4b5fd';
    })
    .arcStroke((a) => Math.min((a.count || 1) * 0.3, 2))
    .arcDashLength(0.4)
    .arcDashGap(0.3)
    .arcDashAnimateTime(1500)
    .ringData(points.filter(p => p.count >= 3).slice(0, 15))
    .ringColor(p => '#7c3aed')
    .ringRadius(p => Math.sqrt(p.count) * 2)
    .ringMaxRadius(6)
    .ringPropagationSpeed(3)
    .ringRepeatPeriod(2000)
    .atmosphereColor('#4361ee')
    .atmosphereAltitude(0.12)
    .onPointClick(p => {
      const win = window.open('https://en.wikipedia.org/wiki/'+encodeURIComponent(p.city||p.country),'_blank');
      return false;
    })
    .backgroundColor('rgba(0,0,0,0)');

  const el = document.getElementById('globeViz');
  globe.width(el.clientWidth).height(el.clientHeight);

  // Auto-rotate
  globe.controls().autoRotate = true;
  globe.controls().autoRotateSpeed = 0.5;
  globe.controls().rotateSpeed = 0.8;

  window.addEventListener('resize', () => {
    globe.width(el.clientWidth).height(el.clientHeight);
  });

  return globe;
}

async function main(){
  try{
    const r = await fetch(STATS_JSON_URL);
    if(!r.ok || r.status === 404){
      document.getElementById('loading').style.display = 'none';
      document.getElementById('load-fail').style.display = 'flex';
      return;
    }
    const raw = await r.json();
    const data = { visits: Array.isArray(raw) ? raw : (raw.record || []) };
    if(!data.visits || data.visits.length === 0){
      document.getElementById('loading').style.display = 'none';
      document.getElementById('load-fail').style.display = 'flex';
      return;
    }

    // Stats
    const visits = data.visits.filter(v => v.type !== 'click');
    const clicks = data.visits.filter(v => v.type === 'click');
    const visitedCountries = new Set(visits.map(v => v.country).filter(Boolean));
    const uniqueCountries = new Set(visits.map(v => v.countryCode).filter(Boolean));

    document.getElementById('visits').textContent = visits.length.toLocaleString();
    document.getElementById('clicks').textContent = clicks.length.toLocaleString();
    document.getElementById('countries').textContent = uniqueCountries.size;

    // Geo points (only visits with geo data)
    const geoVisits = visits.filter(v => v.lat && v.lon);
    const grouped = {};
    geoVisits.forEach(v => {
      const key = v.lat + ',' + v.lon;
      if(!grouped[key]){
        grouped[key] = {
          lat: parseFloat(v.lat),
          lon: parseFloat(v.lon),
          count: 0,
          country: v.country,
          countryCode: v.countryCode,
          city: v.city,
        };
      }
      grouped[key].count++;
    });
    const points = Object.values(grouped);
    points.sort((a,b) => b.count - a.count);

    // Top countries
    const countryCounts = {};
    geoVisits.forEach(v => {
      const key = v.countryCode || '??';
      countryCounts[key] = (countryCounts[key]||0) + 1;
    });
    const sorted = Object.entries(countryCounts).sort((a,b) => b[1] - a[1]).slice(0,8);
    const max = sorted[0] ? sorted[0][1] : 1;
    const isoToFlag = (c) => {
      if(!c || c === '??') return '🌐';
      const code = countryCodeToISO3(c);
      if(!code) return '🌐';
      const offset = 0x1F1E6;
      return String.fromCodePoint(offset + code.charCodeAt(0), offset + code.charCodeAt(1));
    };
    const list = document.getElementById('country-list');
    list.innerHTML = sorted.map(([code, cnt]) => `
      <div class="country-row">
        <span class="flag">${isoToFlag(code)}</span>
        <span class="name">${code === '??' ? 'Unknown' : code}</span>
        <span class="count">${cnt}</span>
        <span class="bar" style="width:${Math.max(4, cnt/max*100)}px"></span>
      </div>
    `).join('');

    // Init globe
    initGlobe(points);

    document.getElementById('loading').style.display = 'none';
  } catch(e){
    console.error('analytics load error', e);
    document.getElementById('loading').style.display = 'none';
    document.getElementById('load-fail').style.display = 'flex';
  }
}

main();
</script>
</body>
</html>
