name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          BASE_PATH: /seeing-single-cell
          NEXT_PUBLIC_BASE_PATH: /seeing-single-cell
          NEXT_PUBLIC_GA_ID: ${{ secrets.NEXT_PUBLIC_GA_ID }}
          NODE_ENV: production
        run: npm run build

      - name: Add .nojekyll
        run: touch out/.nojekyll

      - name: Inject analytics credentials
        if: ${{ secrets.ANALYTICS_BIN_ID != '' && secrets.ANALYTICS_BIN_KEY != '' }}
        run: |
          sed -i "s/__ANALYTICS_BIN_ID__/${{ secrets.ANALYTICS_BIN_ID }}/g" \
            out/scripts/analytics.js out/analytics.html
          sed -i "s/__ANALYTICS_BIN_KEY__/${{ secrets.ANALYTICS_BIN_KEY }}/g" \
            out/scripts/analytics.js
          find out -type f \( -name '*.js' -o -name '*.html' -o -name '*.json' -o -name '*.txt' \) -exec \
            sed -i "s/__ANALYTICS_BIN_ID__/${{ secrets.ANALYTICS_BIN_ID }}/g" {} +
        shell: bash

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          force_orphan: true
